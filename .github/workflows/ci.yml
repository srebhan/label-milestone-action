name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in sync with `runs.using` in action.yml
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Runs the committed dist/index.js, i.e. exactly what the action ships
      - name: Run tests
        run: npm test
      # dist/ is what the action executes, so dependency updates and source
      # changes only reach users once it is rebuilt and committed.
      - name: Check dist is rebuilt
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date, run 'npm run build' and commit the result"
            git status --porcelain dist
            exit 1
          fi
